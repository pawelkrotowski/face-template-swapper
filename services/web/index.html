<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Face Template Swap</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .container { max-width: 720px; margin: 0 auto; padding: 16px; }
      .card { border: 1px solid color-mix(in oklab, canvasText 15%, transparent); border-radius: 16px; padding: 16px; margin: 12px 0; }
      .row { display: grid; gap: 12px; }
      .btn { appearance: none; border: none; border-radius: 12px; padding: 12px 16px; font-weight: 600; cursor: pointer; }
      .btn.primary { background: #2563eb; color: white; }
      .btn.ghost { background: color-mix(in oklab, canvas 90%, canvasText 10%); }
      .thumb { width: 100%; max-height: 320px; object-fit: contain; border-radius: 12px; border: 1px dashed color-mix(in oklab, canvasText 20%, transparent); }
      label span.small { font-size: 12px; opacity: 0.75; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .hint { font-size: 13px; opacity: 0.8; }
      .footer { font-size: 12px; opacity: 0.6; text-align: center; margin-top: 12px; }
      .bar { height: 6px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
      .bar > div { height: 100%; width: 0%; background: #22c55e; transition: width .25s ease; }
      @media (max-width:640px){ .grid-2 { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
