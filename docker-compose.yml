services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - inference-face
      - web
    networks: [ face-template-net ]

#  api:
#    build: ./services/api
#    env_file: .env
#    environment:
#      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
#      - UPLOADS_DIR=${UPLOADS_DIR}
#      - OUTPUTS_DIR=${OUTPUTS_DIR}
#      - INFER_BASE_URL=http://inference-face:8001
#    volumes:
#      - ./data/uploads:${UPLOADS_DIR}
#      - ./data/outputs:${OUTPUTS_DIR}
#    restart: unless-stopped
#    networks: [face-template-net]

  inference-face:
    build: ./services/inference-face
    env_file: .env
    environment:
      - INSIGHTFACE_HOME=/root/.insightface
      - UPLOADS_DIR=${UPLOADS_DIR}
      - OUTPUTS_DIR=${OUTPUTS_DIR}
    # Comment out the next line if you don't have GPU/toolkit
    gpus: all
    shm_size: "1g"
    volumes:
      - ./models_cache:/root/.insightface
      - ./data/uploads:/data/uploads
      - ./data/outputs:/data/outputs
    restart: unless-stopped
    networks: [face-template-net]

  web:
    build: ./services/web
    restart: unless-stopped
    networks: [face-template-net]

networks:
  face-template-net:
    driver: bridge

